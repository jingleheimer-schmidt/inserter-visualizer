
[mod-name]
inserter-visualizer=Inserter Visualizer (Визуализатор манипуляторов)

[mod-description]
inserter-visualizer=Указывает, на какую полосу конвейера размещается содержимое манипуляторов.\n\n- Используйте __CONTROL__toggle-global-inserter-visualizer__ для подсветки точек сброса всех манипуляторов, у только выбранного манипулятора или всех манипуляторов, размещенных на выбранной линии конвейера.\n- Используйте __CONTROL__toggle-selection-highlighting-shortcut__ для переключения подсветки выделения.

[shortcut-name]
toggle-selection-highlighting-shortcut=Переключить подсветку визуализации манипуляторов

[controls]
toggle-global-inserter-visualizer=Переключить подсветку манипуляторов
toggle-selection-highlighting-shortcut=Переключить подсветку выделения

[controls-description]
toggle-global-inserter-visualizer=Если активировано, подсвечивает место сброса груза всех манипуляторов, у только выбранного манипулятора или всех манипуляторов, размещенных на выбранной линии конвейера.
toggle-selection-highlighting-shortcut=При переключении, автоматически подсвечивает точки сброса груза из выбранных манипуляторов, а также всех манипуляторов, размещенных на выбранных линиях конвейеров.

[mod-setting-name]
highlight_color=Цвет подсветки манипулятора
highlights_per_tick=Количество подсвеченных манипуляторов за игровой такт

[status-message]
highlighting-inserters=Подсветка манипуляторов
removing-highlights=Удаление подсветок
status-update=__1__: __2__ из __3__


